[build-system]
requires = ["setuptools>=77,<84", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-android"
version = "0.5.1"
description = "Android device control toolset for hermes-agent"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["requests>=2.28.0,<3", "aiohttp>=3.9.0,<4"]

[project.optional-dependencies]
dev = [
    "build>=1.2.2,<2",
    "pytest>=8.3,<10",
    "pytest-mock>=3.14,<4",
    "responses>=0.25,<1",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
